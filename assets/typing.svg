<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 100" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#14070a" />
    </linearGradient>
  </defs>
  <style>
    .term-window {
      fill: url(#termGrad);
      stroke: #e8212b;
      stroke-width: 1;
      stroke-opacity: 0.35;
    }
    .prompt {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #e8212b;
    }
    .text-line {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 500;
      fill: #f3f4f6;
    }
    .cursor {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      font-weight: 800;
      fill: #e8212b;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes line1 {
      0%, 22% { opacity: 1; }
      24%, 100% { opacity: 0; }
    }
    @keyframes line2 {
      0%, 24% { opacity: 0; }
      26%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes line3 {
      0%, 49% { opacity: 0; }
      51%, 73% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    @keyframes line4 {
      0%, 74% { opacity: 0; }
      76%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }
    .msg1 { animation: line1 16s ease-in-out infinite; }
    .msg2 { animation: line2 16s ease-in-out infinite; }
    .msg3 { animation: line3 16s ease-in-out infinite; }
    .msg4 { animation: line4 16s ease-in-out infinite; }
  </style>

  <!-- Terminal Window Background -->
  <rect class="term-window" x="1" y="1" width="848" height="98" rx="10" />

  <!-- Window Header Bar -->
  <rect x="1" y="1" width="848" height="30" rx="10" fill="#14080b" />
  <rect x="1" y="21" width="848" height="10" fill="#14080b" />
  <line x1="1" y1="31" x2="849" y2="31" stroke="#e8212b" stroke-width="1" stroke-opacity="0.25" />

  <!-- Terminal Controls -->
  <circle cx="20" cy="16" r="5" fill="#e8212b" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="52" cy="16" r="5" fill="#10b981" opacity="0.8" />
  <text x="425" y="20" fill="#6b7280" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">terminal // asadali-secops</text>

  <!-- Command Line Content -->
  <g transform="translate(25, 68)">
    <text class="prompt" x="0" y="0">asad@secops:~$</text>
    
    <!-- Cycling Messages -->
    <g transform="translate(140, 0)">
      <text class="text-line msg1" x="0" y="0">Architecting system stability &amp; enterprise operational security.<tspan class="cursor"> _</tspan></text>
      <text class="text-line msg2" x="0" y="0">SIEM Engineering · CTEM Frameworks · Proactive Threat Hunting.<tspan class="cursor"> _</tspan></text>
      <text class="text-line msg3" x="0" y="0">Diagnosing failures before they become critical incidents.<tspan class="cursor"> _</tspan></text>
      <text class="text-line msg4" x="0" y="0">Linux &amp; Windows Server Hardening · Automated Log Pipelines.<tspan class="cursor"> _</tspan></text>
    </g>
  </g>
</svg>
