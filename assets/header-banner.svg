<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070a" />
      <stop offset="45%" stop-color="#0c0c12" />
      <stop offset="100%" stop-color="#1c070a" />
    </linearGradient>

    <!-- Crimson Cyber Glow -->
    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8212b" />
      <stop offset="50%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#e8212b" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8212b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff3838" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e8212b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="waveGradBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70090e" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#b0131b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#70090e" stop-opacity="0.4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e8212b" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-badge {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #ff4d58;
    }
    .main-title {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 4px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #d1d5db;
    }
    .status-text {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #9ca3af;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes waveFloat {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveFloatBack {
      0% { transform: translateX(0); }
      50% { transform: translateX(40px); }
      100% { transform: translateX(0); }
    }
    .pulse-dot {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: 450px 36px;
    }
    .wave-front {
      animation: waveFloat 8s ease-in-out infinite;
    }
    .wave-back {
      animation: waveFloatBack 12s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="16" fill="url(#cyberGrid)" />
  
  <!-- Outer Cyber Border -->
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="#e8212b" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Corner Tech Accents -->
  <path d="M 16 35 L 16 16 L 35 16" fill="none" stroke="#e8212b" stroke-width="3" stroke-linecap="round" />
  <path d="M 884 35 L 884 16 L 865 16" fill="none" stroke="#e8212b" stroke-width="3" stroke-linecap="round" />
  <path d="M 16 205 L 16 224 L 35 224" fill="none" stroke="#e8212b" stroke-width="3" stroke-linecap="round" />
  <path d="M 884 205 L 884 224 L 865 224" fill="none" stroke="#e8212b" stroke-width="3" stroke-linecap="round" />

  <!-- Top System Badge -->
  <g transform="translate(450, 40)" text-anchor="middle">
    <rect x="-165" y="-14" width="330" height="26" rx="13" fill="#1f070a" stroke="#e8212b" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="-135" cy="-1" r="4.5" fill="#e8212b" class="pulse-dot" filter="url(#neonGlow)" />
    <text x="10" y="4" class="terminal-badge" text-anchor="middle">SECURITY OPERATIONS // SIEM &amp; CTEM</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(450, 115)" text-anchor="middle">
    <!-- Glow shadow for title -->
    <text x="0" y="0" class="main-title" opacity="0.4" filter="url(#neonGlow)" fill="#e8212b">ASAD ALI</text>
    <text x="0" y="0" class="main-title">ASAD ALI</text>
  </g>

  <!-- Role Subtitle -->
  <text x="450" y="152" class="subtitle" text-anchor="middle">
    IT Support Engineer <tspan fill="#e8212b">•</tspan> SIEM &amp; CTEM Specialist <tspan fill="#e8212b">•</tspan> SecOps
  </text>

  <!-- Status Bar Line -->
  <text x="450" y="178" class="status-text" text-anchor="middle">
    ENTERPRISE INFRASTRUCTURE HARDENING &amp; AUTOMATED LOG PIPELINES
  </text>

  <!-- Animated Bottom Waves -->
  <g class="wave-back">
    <path d="M -50 240 Q 200 200, 450 220 T 950 215 L 950 240 Z" fill="url(#waveGradBack)" />
  </g>
  <g class="wave-front">
    <path d="M -50 240 Q 180 215, 450 228 T 950 220 L 950 240 Z" fill="url(#waveGrad)" />
  </g>

  <!-- Glowing Bottom Accent Line -->
  <line x1="60" y1="239" x2="840" y2="239" stroke="url(#cyberRed)" stroke-width="2" filter="url(#neonGlow)" />
</svg>
